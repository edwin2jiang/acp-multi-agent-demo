[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-multi-agent-demo"
version = "0.1.0"
description = "A learning-focused ACP-style multi-agent discovery and stdio JSON-RPC demo."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.scripts]
acp-demo = "acp_demo.run_demo:main"
acp-client = "acp_demo.client:main"
acp-reconnect-demo = "acp_demo.reconnection_demo:main"
acp-registry = "acp_demo.registry:run_registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
